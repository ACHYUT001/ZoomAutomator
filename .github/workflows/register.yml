name: Zoom auto-register

on:
  # Times are UTC. Two runs: Fri 20:00 IST and Sat 20:00 IST. The Saturday run
  # re-registers so that any Sunday schedule changes announced on Saturday are
  # picked up. Confirmation emails may duplicate for Sunday sessions, but the
  # Apps Script moves them to Trash and reschedules (never duplicates) calendar
  # events. Use "Run workflow" (workflow_dispatch) as a manual retry.
  # The Apps Script calendar sync runs shortly after (Fri/Sat 21:00 IST).
  schedule:
    - cron: '30 14 * * 5'   # Friday 20:00 IST
    - cron: '30 14 * * 6'   # Saturday 20:00 IST
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Register for all subjects
        # xvfb gives Chromium a real display (headed = more browser-like).
        run: xvfb-run --auto-servernum -- node register.mjs
        env:
          ZOOM_FIRST: ${{ secrets.ZOOM_FIRST }}
          ZOOM_LAST: ${{ secrets.ZOOM_LAST }}
          ZOOM_EMAIL: ${{ secrets.ZOOM_EMAIL }}

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: 'fail-*.png'
          if-no-files-found: ignore
